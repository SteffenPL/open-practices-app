name: Redirect the previous Pages address
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - scripts/share-vm/redirect.html
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir redirect && cp scripts/share-vm/redirect.html redirect/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
